name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: skydra
          POSTGRES_PASSWORD: skydra
          POSTGRES_DB: skydra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skydra -d skydra"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Superuser of the CI service container; integration tests create their own databases.
      TEST_DATABASE_URL: postgres://skydra:skydra@localhost:5432/skydra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build

  # The deployable image builds and starts its runtime pieces; Terraform is formatted and valid.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t skydra:ci .
      - name: Image smoke test
        run: |
          docker run --rm skydra:ci sh -c '
            test "$(id -u)" != 0 &&
            test -f web/index.html &&
            test -f dist/database/migrate.js &&
            ls migrations/*.sql >/dev/null &&
            node -e "require(\"argon2\"); require(\"pdfkit\")"'
      - name: Landing image serves the pages with security headers
        run: |
          docker build -t skydra-landing:ci apps/landing
          docker run -d --rm --name landing -p 8080:8080 skydra-landing:ci
          for i in $(seq 20); do curl -sf -o /dev/null localhost:8080/ && break; sleep 0.5; done
          for page in / /aciu.html /registracija.html /vertinimas.html /privatumas.html /fonts/fonts.css /css/site.css /js/site.js /js/consent.js /vendor/cookieconsent/cookieconsent.umd.js /favicon.svg; do
            curl -sf -o /dev/null "localhost:8080$page"
          done
          curl -sI localhost:8080/ | grep -qi '^content-security-policy:'
          # Styles and scripts are files only, so the CSP needs no 'unsafe-inline'.
          if grep -lE '<style|style=|<script>' apps/landing/site/*.html; then exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: www.skydra.eu' localhost:8080/)" = 301
          docker stop landing
      - name: Terraform fmt and validate
        run: |
          tf() { docker run --rm -v "$PWD/infra/terraform:/w" -w "/w/$1" hashicorp/terraform:1.13 "${@:2}"; }
          tf . fmt -check -recursive
          for stack in shared env landing; do
            tf "$stack" init -backend=false -input=false
            tf "$stack" validate
          done

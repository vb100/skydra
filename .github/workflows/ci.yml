name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: skydra
          POSTGRES_PASSWORD: skydra
          POSTGRES_DB: skydra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skydra -d skydra"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Superuser of the CI service container; integration tests create their own databases.
      TEST_DATABASE_URL: postgres://skydra:skydra@localhost:5432/skydra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build

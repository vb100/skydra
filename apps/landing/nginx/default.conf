# Static marketing site (skydra.eu). Cloud Run terminates TLS and forwards to port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirects keep the scheme and host the visitor used, not the container's http://...:8080.
    absolute_redirect off;

    # One canonical host once the domain points here: www.skydra.eu -> skydra.eu.
    if ($host = www.skydra.eu) {
        return 301 https://skydra.eu$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Pages: always revalidated, so a new deployment shows at once.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fonts never change under the same name.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Scripts keep their names between deployments: cache briefly.
    location /js/ {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

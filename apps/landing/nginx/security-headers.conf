# Included in every location that sets headers: nginx drops inherited add_header lines as soon as a
# location adds its own.
#
# CSP: styles and scripts are files only (no inline <style>, style="" or <script>). Google
# Analytics 4 is allowed as Google documents for GA4; js/consent.js loads it only after consent. Forms post to formsubmit.co, which then redirects to https://skydra.eu/aciu.html; browsers
# check form-action against that redirect too, so skydra.eu is listed while the site is still
# served from another origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; form-action 'self' https://formsubmit.co https://skydra.eu; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

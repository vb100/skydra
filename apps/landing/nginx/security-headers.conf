# Included in every location that sets headers: nginx drops inherited add_header lines as soon as a
# location adds its own.
#
# CSP: the pages use inline style attributes, so styles allow 'unsafe-inline'; scripts are files
# only. Forms post to formsubmit.co, which then redirects to https://skydra.eu/aciu.html; browsers
# check form-action against that redirect too, so skydra.eu is listed while the site is still
# served from another origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self' https://formsubmit.co https://skydra.eu; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

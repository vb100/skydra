name: skydra

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: skydra
      POSTGRES_PASSWORD: skydra
      POSTGRES_DB: skydra
    ports:
      - '5433:5432' # 5433 on the host: avoids clashing with a locally installed PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skydra -d skydra']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local stand-in for Google Cloud Storage (documents, exports).
  gcs:
    image: fsouza/fake-gcs-server:1.52
    command: ['-scheme', 'http', '-port', '4443', '-external-url', 'http://localhost:4443']
    ports:
      - '4443:4443'

volumes:
  postgres-data:
